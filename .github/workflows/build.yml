name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -r companion/requirements-dev.txt
      - name: Tests
        working-directory: companion
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile for Arduino Leonardo
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:leonardo --output-dir out firmware/RideSimsPanel
      - name: Name the hex with the firmware version
        run: |
          FW=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/RideSimsPanel/RideSimsPanel.ino)
          cp out/RideSimsPanel.ino.hex "RideSimsPanel-Firmware-$FW.hex"
          echo "FW=$FW" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: RideSimsPanel-Firmware-*.hex

  windows:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r companion/requirements-dev.txt
      - name: Build exe
        working-directory: companion
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ridesims_panel/__init__.py)
          echo "Building $VERSION"
          pyinstaller --onefile --windowed --name "RideSimsPanel-$VERSION" run.py
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: companion-windows
          path: companion/dist/RideSimsPanel-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' companion/ridesims_panel/__init__.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION" && exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
